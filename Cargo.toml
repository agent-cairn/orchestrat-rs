[package]
name = "orchestrat-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-native LLM orchestration engine with Valkey persistence"
license = "Apache-2.0"
repository = "https://github.com/agent-cairn/orchestrat-rs"

[dependencies]
# LLM abstraction layer
rig-core = "0.5"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Valkey persistence (redis crate is Valkey-compatible)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }
