[package]
name = "orchestrat-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-native LLM orchestration engine with Valkey persistence"
license = "Apache-2.0"
repository = "https://github.com/agent-cairn/orchestrat-rs"
authors = ["Avi Fenesh <avi@fenesh.io>"]

[dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# LLM integration
rig-core = "0.5"

# State persistence (using git for now until crates.io publishes)
valkey-glide = { git = "https://github.com/valkey-io/valkey-glide", optional = true }

[dev-dependencies]
tokio-test = "0.4"
